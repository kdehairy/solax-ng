name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/*.yml'
      - '.pre-commit-config.yaml'
      - 'mypy.ini'
      - '.flake8'
      - '.isort.cfg'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/*.yml'
      - '.pre-commit-config.yaml'
      - 'mypy.ini'
      - '.flake8'
      - '.isort.cfg'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Sync dependencies
      run: uv sync --python ${{ matrix.python-version }}
    - name: Check code style with black
      run: |
        uv run black --check .
    - name: Check types with mypy
      run: |
        uv run mypy .
    - name: Check imports with isort
      run: |
        uv run isort --check-only --profile black .
    - name: Lint with flake8
      run: |
        uv run flake8 --ignore=E501,E704 src tests
    - name: Lint with pylint
      run: |
        uv run pylint -d 'C0111' src tests
    - name: Test with pytest
      run: |
        uv run pytest --cov=solaxng --cov-branch --cov-report=term-missing .
        mv .coverage .coverage.${{ matrix.python-version }}
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: .coverage-${{ matrix.python-version }}
        path: .coverage.${{ matrix.python-version }}
        if-no-files-found: error
        include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Download coverage files
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Coverage combine
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade coverage
        coverage combine
        coverage report -m --fail-under=100

  deploy:
    needs: [coverage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Verify tag signature
      env:
        GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
      run: |
        echo "$GPG_PUBLIC_KEY" | gpg --import
        git fetch --force origin tag "$GITHUB_REF_NAME" --no-tags
        git tag -v "$GITHUB_REF_NAME"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build
      run: |
        make build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
